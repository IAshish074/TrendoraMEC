[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/tmp/supervisord.pid

[program:auth]
command=java -Xms64m -Xmx160m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -jar /app/auth-service.jar --server.port=8081
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:user]
command=java -Xms64m -Xmx160m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -jar /app/user-service.jar --server.port=8082
autostart=true
autorestart=true
priority=20
